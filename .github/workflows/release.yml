name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # A write deploy key is the only bypass actor the main ruleset
      # allows on a user-owned repo; GITHUB_TOKEN cannot push to main.
      - uses: actions/checkout@v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION=$(bun -e '
            const bump = process.env.BUMP;
            const pkg = await Bun.file("package.json").json();
            const [major, minor, patch] = pkg.version.split(".").map(Number);
            const next =
              bump === "major"
                ? [major + 1, 0, 0]
                : bump === "minor"
                  ? [major, minor + 1, 0]
                  : [major, minor, patch + 1];
            pkg.version = next.join(".");
            await Bun.write("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            process.stdout.write(pkg.version);
          ')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The Unreleased section becomes this version's, so the package, the
      # tag, and `npx monochrome changelog` carry its notes. A release
      # without notes stops here, before anything is published.
      - name: Stamp changelog
        run: |
          bun -e '
            const file = Bun.file("CHANGELOG.md");
            const text = await file.text();
            const notes = /^## Unreleased\n([\s\S]*?)(?=^## |(?![\s\S]))/m.exec(text)?.[1];
            if (!notes?.trim()) {
              console.error("CHANGELOG.md needs a non-empty ## Unreleased section.");
              process.exit(1);
            }
            const date = new Date().toISOString().slice(0, 10);
            await Bun.write(file, text.replace(/^## Unreleased$/m, `## ${process.env.VERSION} (${date})`));
          '

      # Build after the bump: the build stamps the version into the files
      # `add` copies and restamps versionMeta.
      - run: bun run build

      - run: test -f dist/index.js

      - name: Publish to npm
        run: bunx npm@latest publish --access public --ignore-scripts --provenance

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit --no-verify -m "v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD --follow-tags
