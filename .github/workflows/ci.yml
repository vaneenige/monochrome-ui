name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run typecheck

      - run: npx playwright install chromium

      - run: npm run test
