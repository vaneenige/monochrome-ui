<div id="output" data-testid="output"></div>
<style>
  .scrollable-content { width: 200px; height: 80px; overflow: auto; }
  .scrollable-content > div { height: 400px; }
</style>
<button type="button" data-testid="focus-before">Focus before</button>
<div class="popover">
  <button
    data-testid="click-trigger"
    data-action="trigger-clicked"
    type="button"
    id="mct:popover:1"
    aria-controls="mcc:popover:1"
    aria-expanded="false"
  >Open</button>
  <div
    data-testid="click-content"
    id="mcc:popover:1"
    aria-labelledby="mct:popover:1"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <p data-testid="click-text">Click content</p>
    <button type="button" data-testid="copy-button" data-action="copy-clicked">Copy</button>
  </div>
</div>
<button type="button" data-testid="focus-after">Focus after</button>
<div class="popover">
  <button
    data-testid="second-trigger"
    type="button"
    id="mct:popover:2"
    aria-controls="mcc:popover:2"
    aria-expanded="false"
  >Second</button>
  <div
    data-testid="second-content"
    id="mcc:popover:2"
    aria-labelledby="mct:popover:2"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <p>Second content</p>
  </div>
</div>
<div class="popover">
  <button
    data-testid="disabled-trigger"
    type="button"
    id="mct:popover:3"
    aria-controls="mcc:popover:3"
    aria-expanded="false"
    aria-disabled="true"
  >Disabled</button>
  <div
    data-testid="disabled-content"
    id="mcc:popover:3"
    aria-labelledby="mct:popover:3"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <p>Disabled content</p>
  </div>
</div>
<div class="popover">
  <button
    data-testid="scroll-trigger"
    type="button"
    id="mct:popover:4"
    aria-controls="mcc:popover:4"
    aria-expanded="false"
  >Scroll</button>
  <div
    data-testid="scroll-content"
    id="mcc:popover:4"
    aria-labelledby="mct:popover:4"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <div data-testid="scroll-inner" class="scrollable-content">
      <div>Long content to scroll through</div>
    </div>
  </div>
</div>
<div class="popover">
  <button
    data-testid="described-trigger"
    type="button"
    id="mct:popover:5"
    aria-controls="mcc:popover:5"
    aria-expanded="false"
  >Described</button>
  <div
    data-testid="described-content"
    id="mcc:popover:5"
    aria-labelledby="mct:popover:5"
    aria-describedby="mcc:popover-description:5"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <p id="mcc:popover-description:5" data-testid="described-desc">A short description for AT.</p>
    <button type="button">Action</button>
  </div>
</div>
<div class="popover">
  <button
   
    type="button"
    id="mct:popover:6"
    aria-controls="mcc:popover:6"
    aria-expanded="false"
  >Open dialog popover</button>
  <div
    data-testid="dialog-popover-content"
    role="dialog"
    id="mcc:popover:6"
    aria-label="Filter results"
    aria-describedby="mcc:popover-description:6"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <h2>Filter results</h2>
    <p id="mcc:popover-description:6">Pick a date range.</p>
    <button type="button">Apply</button>
  </div>
</div>
<div class="popover">
  <button
   
    type="button"
    id="mct:popover:7"
    aria-controls="mcc:popover:7"
    aria-expanded="false"
  >Plain</button>
  <div
    data-testid="aria-label-content"
    id="mcc:popover:7"
    aria-label="Quick info"
    aria-hidden="true"
    popover="manual"
    tabindex="-1"
  >
    <p>Just a label.</p>
  </div>
</div>
<button data-testid="menu-trigger" type="button" id="mct:menu:1" aria-controls="mcc:menu:1" aria-expanded="false" aria-haspopup="menu" tabindex="0" role="button">Menu</button>
<ul data-testid="menu-list" role="menu" id="mcc:menu:1" aria-labelledby="mct:menu:1" aria-hidden="true" popover="manual">
  <li role="none">
    <button type="button" role="menuitem" tabindex="-1">Menu Item 1</button>
  </li>
</ul>
