<button data-testid="trigger" type="button"
  id="mct:dialog-open:1" aria-haspopup="dialog" aria-controls="mcc:dialog:1">Open form dialog</button>
<dialog data-testid="content"
  id="mcc:dialog:1"
  aria-labelledby="mcc:dialog-title:1"
  tabindex="-1">
  <h2 id="mcc:dialog-title:1">Confirm</h2>
  <form method="dialog">
    <button data-testid="submit" type="submit">Confirm</button>
  </form>
  <button data-testid="close" type="button" id="mct:dialog-close:1">Cancel</button>
</dialog>
